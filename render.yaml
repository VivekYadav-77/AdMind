services:
  - type: web
    name: admind-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite-preview
      - key: GEMINI_USE_MOCK_FALLBACK
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GAS_WEBHOOK_URL
        sync: false
      - key: GAS_SECRET
        sync: false
      - key: GEMINI_IMAGE_API_KEY
        sync: false
